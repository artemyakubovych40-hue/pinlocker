name: Build PIN Locker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip PinLocker_CloudBuild.zip -d source

      - name: Build APK
        working-directory: source/PinLocker
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PIN-Locker-APK
          path: source/PinLocker/app/build/outputs/apk/debug/*.apk
